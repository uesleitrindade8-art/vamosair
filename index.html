<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Uma pergunta para você...</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a0b2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Usa a altura total da tela */
            height: 100dvh; /* Ajuste para a barra do navegador no celular */
            overflow: hidden;
            font-family: 'VT323', monospace;
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(white 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        #typewriter-text {
            font-size: 26px;
            min-height: 150px;
            color: #ff79c6;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            height: 22px;
            background-color: #ff79c6;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        #question-area {
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 1.5s ease;
        }

        #final-question {
            font-family: 'Press Start 2P', cursive;
            font-size: 20px;
            color: #50fa7b;
            text-shadow: 3px 3px 0px #000;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .buttons {
            display: flex;
            gap: 40px;
            position: relative;
            height: 60px;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        button {
            font-family: 'Press Start 2P', cursive;
            font-size: 14px;
            padding: 15px 25px;
            border: 4px solid #000;
            cursor: pointer;
            color: #fff;
            box-shadow: 4px 4px 0px #000;
            transition: transform 0.1s;
            -webkit-tap-highlight-color: transparent; /* Remove o flash azul no toque do celular */
        }

        button:active {
            transform: translate(4px, 4px);
            box-shadow: 0 0 0 #000;
        }

        #btn-yes {
            background-color: #50fa7b;
            color: #1a0b2e;
        }

        #btn-no {
            background-color: #ff5555;
            position: absolute;
        }

        #popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #282a36;
            border: 6px solid #50fa7b;
            padding: 30px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 0 9999px rgba(0,0,0,0.8);
            animation: popIn 0.5s ease;
            width: 80%;
            max-width: 400px;
        }

        #popup h2 {
            font-family: 'Press Start 2P', cursive;
            color: #50fa7b;
            margin-bottom: 20px;
            font-size: 18px;
            text-shadow: 2px 2px 0 #000;
        }

        #popup p {
            font-family: 'VT323', monospace;
            font-size: 22px;
            color: #fff;
        }

        /* Ajustes de tamanho para telas pequenas (Celulares) */
        @media (max-width: 600px) {
            #typewriter-text { font-size: 22px; }
            #final-question { font-size: 16px; }
            button { font-size: 12px; padding: 12px 20px; }
            #popup h2 { font-size: 14px; }
            #popup p { font-size: 18px; }
        }

        @keyframes popIn {
            from { transform: translate(-50%, -50%) scale(0); }
            to { transform: translate(-50%, -50%) scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="stars"></div>

    <div class="container">
        <div id="typewriter-text"><span id="text"></span><span class="cursor"></span></div>

        <div id="question-area">
            <h1 id="final-question">Aceita sair comigo?</h1>
            <div class="buttons">
                <button id="btn-yes">SIM</button>
                <button id="btn-no">NÃO</button>
            </div>
        </div>
    </div>

    <div id="popup">
        <h2>COMBINADO! 🥳❤️</h2>
        <p>Mal posso esperar pelo nosso encontro.<br>Prometo ser incrível!</p>
    </div>

    <script>
        const textElement = document.getElementById('text');
        const questionArea = document.getElementById('question-area');
        const btnNo = document.getElementById('btn-no');
        const btnYes = document.getElementById('btn-yes');
        const popup = document.getElementById('popup');

        const messages = [
            "Oi... eu estava pensando em algumas coisas...",
            "Sobre como o seu sorriso ilumina qualquer dia nublado.",
            "E como os seus olhos parecem conter o universo inteiro.",
            "Sem falar no seu cabelo, que sempre está perfeito.",
            "E os seus lábios... bem, eu better não falar sobre eles aqui.",
            "Enfim, eu não consigo parar de pensar em você."
        ];

        let msgIndex = 0;
        let charIndex = 0;
        let isDeleting = false;

        function typeWriter() {
            const currentMsg = messages[msgIndex];
            
            if (!isDeleting) {
                textElement.innerHTML = currentMsg.substring(0, charIndex + 1);
                charIndex++;
                
                if (charIndex === currentMsg.length) {
                    if (msgIndex === messages.length - 1) {
                        setTimeout(showQuestion, 1500);
                        return;
                    }
                    isDeleting = true;
                    setTimeout(typeWriter, 2000);
                    return;
                }
                setTimeout(typeWriter, 60);
            } else {
                textElement.innerHTML = currentMsg.substring(0, charIndex - 1);
                charIndex--;
                
                if (charIndex === 0) {
                    isDeleting = false;
                    msgIndex++;
                    setTimeout(typeWriter, 500);
                    return;
                }
                setTimeout(typeWriter, 30);
            }
        }

        function showQuestion() {
            document.getElementById('typewriter-text').style.display = 'none';
            questionArea.style.display = 'flex';
        }

        // --- A MÁGICA DA FUGA NO CELULAR E PC ---
        function moveButton(event) {
            // 'event' existe no toque/click. preventDefault() impede que o clique seja registrado no celular!
            if (event && event.preventDefault) {
                event.preventDefault();
            }

            // Pegando as dimensões reais da tela do dispositivo
            const screenWidth = window.innerWidth;
            const screenHeight = window.innerHeight;

            // Calculando uma posição aleatória, garantindo que o botão não saia da tela
            const x = Math.random() * (screenWidth - btnNo.offsetWidth - 20);
            const y = Math.random() * (screenHeight - btnNo.offsetHeight - 20);
            
            btnNo.style.position = 'fixed';
            btnNo.style.left = `${x}px`;
            btnNo.style.top = `${y}px`;

            const funnyTexts = ["NÃO", "Tenta de novo!", "Fui!", "Não consegue né?", "Catch me!", "Ainda não..."];
            btnNo.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
        }

        // Eventos para PC (Mouse)
        btnNo.addEventListener('mouseover', moveButton);
        btnNo.addEventListener('click', moveButton);

        // Evento para Celular (Touch) - touchstart dispara ao tocar na tela
        btnNo.addEventListener('touchstart', moveButton, { passive: false });

        // Ação do botão SIM
        btnYes.addEventListener('click', () => {
            popup.style.display = 'block';
            btnNo.style.display = 'none';
            btnYes.innerText = "YAY!";
        });

        // Inicia
        setTimeout(typeWriter, 1000);

    </script>
</body>
</html>
